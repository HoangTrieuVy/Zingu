; Zingu firmware — PlatformIO project configuration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -Wall
    -Wextra
    -std=gnu++17

build_unflags =
    -std=gnu++11

lib_deps =
    ; MPU-6050 raw register access is done in lib/Imu; only Wire is needed.
